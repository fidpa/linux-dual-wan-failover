name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # Fail on warnings; suppress SC1091 (sourced files outside repo path
          # in CI — the toolkit-aware loader handles this at runtime).
          shellcheck \
            --severity=warning \
            --exclude=SC1091 \
            --shell=bash \
            src/lib/*.sh \
            src/services/*.sh \
            plugins/alerting/*.sh \
            plugins/quota-providers/custom-template/*.sh

  bashate:
    name: bashate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bashate
        run: |
          pip install bashate
          bashate --ignore E006,E040 \
            src/lib/*.sh \
            src/services/*.sh \
            plugins/alerting/*.sh

  bats:
    name: bats unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and python3
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3
      - name: Run unit tests
        run: bats --print-output-on-failure tests/unit/

  ruff:
    name: ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python sources
        run: |
          ruff check \
            src/services/failover-metrics-collector.py \
            plugins/quota-providers/netgear-lm1200/collect-quota.py
      - name: Format check
        run: |
          ruff format --check \
            src/services/failover-metrics-collector.py \
            plugins/quota-providers/netgear-lm1200/collect-quota.py

  systemd-syntax:
    name: systemd unit syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify unit files parse
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd
          for f in systemd/*.service systemd/*.timer; do
            sudo systemd-analyze verify --recursive-errors=yes "$f" || true
          done

  schema:
    name: JSON schema sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate snapshot schema is valid JSON
        run: python3 -c "import json; json.load(open('plugins/quota-providers/_schema/quota-snapshot.schema.json'))"
