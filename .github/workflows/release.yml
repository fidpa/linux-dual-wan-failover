name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The VERSION file is the single source for the running version (0.7.1).
      # A tag whose number the file does not carry would ship a release that
      # reports the previous version at runtime.
      - name: VERSION file matches the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "VERSION says '${FILE_VERSION}', tag says '${VERSION}'"
            exit 1
          fi
          echo "OK: VERSION and tag both say ${VERSION}"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          # Match the literal heading prefix "## [VERSION]" at column 1, via index()
          # rather than a regex: the brackets would need escaping that does not survive
          # the shell, and a plain substring search would also hit a heading that merely
          # mentions another version in its headline, serving that text under the wrong tag.
          HEADING="## [${VERSION}]"

          # Two stop conditions. The second one matters for the oldest section:
          # this changelog ends with the [Unreleased]:/[0.9.5]:/... link block, and
          # without it the extraction would run to end of file and paste those links
          # into the release body.
          awk -v head="$HEADING" '
            index($0, head) == 1 { p=1; next }
            /^## \[/         { if (p) exit }
            /^\[[^]]+\]: /   { if (p) exit }
            p { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          test -s release-notes.md || { echo "Empty release notes for $VERSION"; exit 1; }
          cat release-notes.md

          # Release title: "vX.Y.Z: <headline>". The headline is the trailing part of the
          # section heading after the date. Without it action-gh-release falls back to the
          # bare tag name, which duplicates the version already shown next to it.
          HEADLINE=$(awk -v head="$HEADING" '
            index($0, head) == 1 {
              if (match($0, /- [0-9]{4}-[0-9]{2}-[0-9]{2}: /)) {
                print substr($0, RSTART + RLENGTH)
              }
              exit
            }
          ' CHANGELOG.md)
          if [ -n "$HEADLINE" ]; then
            echo "title=v${VERSION}: ${HEADLINE}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No headline in the '${HEADING}' heading, falling back to the bare tag name as the release title"
            echo "title=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.title }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
