# SPDX-License-Identifier: MIT
# ============================================================================
# linux-dual-wan-failover — example config: DSL primary + LTE backup
# ============================================================================
#
# Concrete starting point for the most common homelab dual-WAN setup:
#   - DSL/fiber/cable on a wired NIC (eth0)
#   - LTE/4G/5G modem on a USB or PCIe interface (lte0)
#
# Copy this file and edit the four REQUIRED variables marked below.
# All other variables have sane defaults documented in failover.conf.example.
#
# Usage:
#   sudo cp config/examples/dual-wan-dsl-lte.conf /etc/linux-dual-wan-failover/failover.conf
#   sudo $EDITOR /etc/linux-dual-wan-failover/failover.conf

# ============================================================================
# REQUIRED — edit these four for your setup
# ============================================================================

# Primary uplink interface (DSL / fiber / cable / second wired ISP).
# Find it with: ip -br link
PRIMARY_IFACE=eth0

# Backup uplink interface (LTE / 4G / 5G modem).
BACKUP_IFACE=lte0

# NetworkManager connection names for both uplinks.
# Find them with: nmcli connection show
PRIMARY_NM_CONNECTION=WAN-Primary
BACKUP_NM_CONNECTION=LTE-Backup

# ============================================================================
# Routing metrics (defaults work for most setups)
# ============================================================================
# Lower metric = preferred. Failover demotes PRIMARY_METRIC_NORMAL → DEMOTED.
PRIMARY_METRIC_NORMAL=50
PRIMARY_METRIC_DEMOTED=500
BACKUP_METRIC=200

# ============================================================================
# Health-check targets
# ============================================================================
# Four diverse anycast resolvers — failover only fires if all four fail.
CHECK_IPS=("8.8.8.8" "1.1.1.1" "9.9.9.9" "208.67.222.222")
DNS_SERVERS=("8.8.8.8" "1.1.1.1")
DNS_TEST_DOMAINS=("google.com" "cloudflare.com")

# ============================================================================
# Timing
# ============================================================================
CHECK_INTERVAL=15                 # scoring round every 15 s
ROUTE_GUARDIAN_CHECK_INTERVAL=10  # route enforcement every 10 s

# ============================================================================
# Hysteresis & anti-flap
# ============================================================================
FAILOVER_THRESHOLD_DOWN=60        # failover when score drops below
FAILOVER_THRESHOLD_UP=80          # failback when score recovers above
HYSTERESIS_GAP=20

FAILURE_THRESHOLD=5               # 5 × 15 s = 75 s degraded before failover
RECOVERY_THRESHOLD=20             # 20 × 15 s = 5 min stable before failback
EMERGENCY_THRESHOLD=15            # one bad round below this triggers immediate failover

ANTI_FLAPPING_DELAY=600            # 10 min cooldown for failback + manual actions
EMERGENCY_FAILBACK_COOLDOWN=3600   # 60 min after emergency failback
EMERGENCY_FAILBACK_MIN_BACKUP_TIME=1800  # 30 min on backup before the escape hatch opens
EMERGENCY_FAILBACK_DEGRADED_CHECKS=6     # 6 fresh collector readings ≈ 300 s of evidence

MIN_FAILBACK_SCORE=60
MIN_BACKUP_TIME=3600              # stay on backup ≥ 1 h after failover
MIN_STABLE_DURATION=900           # primary must be stable ≥ 15 min before failback
STABILITY_RESET_THRESHOLD=50

# ============================================================================
# Last-resort failover — DISABLED by default
# ============================================================================
# When the LTE backup is over its monthly quota, the score is capped to 0,
# blocking failover. Enable this only if "always online" matters more than
# overage charges to your ISP.
LAST_RESORT_ENABLED=false
LAST_RESORT_PRIMARY_THRESHOLD=25
LAST_RESORT_COOLDOWN=1800

# ============================================================================
# Latency / packet-loss thresholds
# ============================================================================
# DSL / fiber / cable
DSL_LATENCY_EXCELLENT=15
DSL_LATENCY_GOOD=50
DSL_LATENCY_WARNING=100
DSL_LATENCY_CRITICAL=200

# LTE / 4G / 5G — relaxed because cellular has higher physics-floor latency
LTE_LATENCY_EXCELLENT=40
LTE_LATENCY_GOOD=80
LTE_LATENCY_WARNING=150
LTE_LATENCY_CRITICAL=300

PACKET_LOSS_GOOD=5
PACKET_LOSS_WARNING=10
PACKET_LOSS_CRITICAL=20

# ============================================================================
# Plugins — alerting
# ============================================================================
# Default: silent. Switch to mattermost or webhook to receive alerts.
ALERTING_BACKEND=none
ALERTING_PLUGIN_DIR=/usr/local/lib/linux-dual-wan-failover/plugins/alerting

# ============================================================================
# Plugins — backup-link quota provider
# ============================================================================
# Default: disabled. If your LTE modem matches one of the bundled providers
# (currently: netgear-lm1200), set QUOTA_PROVIDER and follow
# docs/how-to/configure-quota-tracking.md for the per-provider env file.
QUOTA_PROVIDER=none
QUOTA_SNAPSHOT_PATH=/var/lib/linux-dual-wan-failover/quota-snapshot.json
QUOTA_SNAPSHOT_MAX_STALE_SEC=3600

QUOTA_CAP_TIER_90=40
QUOTA_CAP_TIER_96=10
QUOTA_CAP_TIER_100=0
